spring:
  application:
    name: ai-assisted-url-shortner
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${SPRING_DATASOURCE_USERNAME:shortener}
    password: ${SPRING_DATASOURCE_PASSWORD:shortener}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 200ms

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  api-key: ${APP_API_KEY:}
  ip-hash-salt: ${APP_IP_HASH_SALT:dev-only-salt}
  code-length: 8
  cache-ttl: 1h
  negative-cache-ttl: 60s
  rate-limit:
    create-per-minute: 30
    redirect-per-minute: 120
